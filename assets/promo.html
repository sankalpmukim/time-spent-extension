<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Time Spent promo</title>
    <style>
      html, body { margin: 0; padding: 0; }
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        background: #f6f7f9;
      }
      /* fake browser chrome */
      .browser {
        position: absolute;
        inset: 0;
        background: #dee1e6;
      }
      .bar {
        height: 44px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 14px;
      }
      .dot { width: 12px; height: 12px; border-radius: 50%; background: #b8bcc4; }
      .urlbox {
        flex: 1;
        height: 28px;
        border-radius: 14px;
        background: #fff;
        margin-left: 12px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        color: #5f6368;
        font-size: 13px;
      }
      .page {
        position: absolute;
        top: 44px; left: 0; right: 0; bottom: 0;
        background: #fff;
        overflow: hidden;
      }
      .col { max-width: 680px; margin: 40px auto; padding: 0 24px; }
      .feed-headline { height: 28px; width: 80%; background: #202124; border-radius: 4px; margin: 0 0 10px; }
      .line { height: 12px; background: #e8eaed; border-radius: 3px; margin: 9px 0; }
      .line.short { width: 62%; }
      .line.mid { width: 84%; }
      .thumb { height: 220px; width: 632px; background: linear-gradient(135deg, #e8eaed, #f1f3f4); border-radius: 8px; margin: 22px 0; }
      .badge-tag {
        display: inline-block;
        background: #fce8e6;
        color: #c5221f;
        font-size: 12px;
        font-weight: 700;
        padding: 2px 10px;
        border-radius: 999px;
        margin-bottom: 14px;
      }
      /* the overlay chip, exactly like the extension's */
      .chip {
        position: fixed;
        top: 60px;
        right: 24px;
        padding: 0.32em 0.6em;
        background: rgba(13, 13, 16, 0.88);
        color: #ff453a;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        font-size: 74px;
        line-height: 1;
        border-radius: 0.35em;
        box-shadow: 0 2px 14px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.14);
        text-shadow: 0 0 14px rgba(255,69,58,0.9);
        white-space: nowrap;
        z-index: 999;
        transform: rotate(-1.2deg);
      }
      .chip-label {
        position: fixed;
        top: 170px;
        right: 40px;
        background: #202124;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
        padding: 6px 12px;
        border-radius: 8px;
        z-index: 999;
      }
      .hint {
        position: fixed;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(13,13,16,0.92);
        color: #fff;
        font-size: 22px;
        font-weight: 600;
        padding: 14px 26px;
        border-radius: 12px;
        z-index: 999;
      }
    </style>
  </head>
  <body>
    <div class="browser">
      <div class="bar">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        <div class="urlbox">🔒 www.endless-scrolling-feed.com/today</div>
      </div>
      <div class="page">
        <div class="col">
          <div class="badge-tag">RECOMMENDED FOR YOU</div>
          <div class="feed-headline"></div>
          <div class="line mid"></div>
          <div class="line"></div>
          <div class="line short"></div>
          <div class="thumb"></div>
          <div class="line"></div>
          <div class="line mid"></div>
          <div class="line short"></div>
          <div class="line"></div>
          <div class="line mid"></div>
          <div class="thumb" style="height:160px"></div>
          <div class="line short"></div>
          <div class="line"></div>
        </div>
      </div>
    </div>
    <div class="chip">2:41:07</div>
    <div class="chip-label">today, so far</div>
    <div class="hint">The counter only gets bigger. Drag it to any corner — there is no hide button.</div>
  </body>
</html>
