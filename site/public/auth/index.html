<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Time Spent — Sign in</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #101014;
        color: #f2f2f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
        padding: 24px;
      }
      main { max-width: 400px; text-align: center; }
      .digits {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: -0.02em;
        background: rgba(13,13,16,0.86);
        border-radius: 12px;
        padding: 0.25em 0.5em;
        display: inline-block;
        box-shadow: 0 2px 14px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.14);
      }
      h1 { font-size: 20px; margin: 20px 0 6px; }
      p { color: #9a9aa5; font-size: 14px; line-height: 1.6; margin: 8px 0 20px; }
      #status { min-height: 20px; font-size: 13px; }
      #error { color: #ff453a; font-size: 13px; white-space: pre-wrap; text-align: left; }
    </style>
  </head>
  <body>
    <main>
      <span class="digits">1:07:42</span>
      <h1>Time Spent — Sync</h1>
      <p>Sign in with Google to merge your time totals across every browser and device. Merging only ever keeps the larger number — you can't cheat by clearing one browser.</p>
      <div id="g_id_signon"></div>
      <p id="status"></p>
      <pre id="error"></pre>
    </main>
    <script>
      const CLIENT_ID = "__GOOGLE_CLIENT_ID__";
      function init() {
        const status = document.getElementById("status");
        const error = document.getElementById("error");
        const params = new URLSearchParams(location.search);
        const redirect = params.get("redirect") || "";

        let ok = false;
        try {
          const u = new URL(redirect);
          ok =
            u.protocol === "https:" &&
            (u.hostname.endsWith(".chromiumapp.org") ||
              u.hostname.endsWith(".extensions.mozilla.org"));
        } catch (e) {}

        if (!ok) {
          error.textContent =
            "This sign-in page must be opened from the Time Spent extension (bad or missing redirect parameter).";
          return;
        }
        if (!CLIENT_ID || CLIENT_ID.startsWith("__")) {
          error.textContent = "Sign-in is not configured yet (missing Google client ID).";
          return;
        }
        if (!window.google?.accounts?.id) {
          error.textContent = "Google sign-in failed to load. Check your network and retry.";
          return;
        }

        window.google.accounts.id.initialize({
          client_id: CLIENT_ID,
          auto_select: true,
          callback: (resp) => {
            status.textContent = "Signed in — returning to the extension…";
            const sep = redirect.includes("#") ? "" : "#";
            window.location.href = redirect + sep + "id_token=" + encodeURIComponent(resp.credential);
          },
        });
        window.google.accounts.id.renderButton(document.getElementById("g_id_signon"), {
          theme: "filled_black",
          size: "large",
          text: "signin_with",
          shape: "pill",
        });
        window.google.accounts.id.prompt();
      }
      window.addEventListener("load", init);
    </script>
  </body>
</html>
